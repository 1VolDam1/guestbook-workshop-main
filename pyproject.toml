[project]
name = "guestbook"
version = "1.0.0"
description = "FastAPI guestbook backed by PostgreSQL"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
